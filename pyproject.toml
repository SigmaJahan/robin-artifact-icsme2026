[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robin"
version = "1.0.0"
description = "ROBIN: Repair Of Bias via INtervention -- head-level fairness debugging for transformer LMs"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["robin*"]
